name: dbt CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE:  FINANCIAL_ANALYTICS
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake==1.8.0

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          python3 - <<'PYEOF'
          import os, pathlib
          content = "\n".join([
            "financial_analytics_dbt:",
            "  target: dev",
            "  outputs:",
            "    dev:",
            "      type: snowflake",
            "      account: \"" + os.environ["SNOWFLAKE_ACCOUNT"] + "\"",
            "      user: \"" + os.environ["SNOWFLAKE_USER"] + "\"",
            "      password: \"" + os.environ["SNOWFLAKE_PASSWORD"] + "\"",
            "      database: FINANCIAL_ANALYTICS",
            "      warehouse: \"" + os.environ["SNOWFLAKE_WAREHOUSE"] + "\"",
            "      schema: STAGING",
            "      role: \"" + os.environ["SNOWFLAKE_ROLE"] + "\"",
            "      threads: 4",
          ]) + "\n"
          pathlib.Path.home().joinpath(".dbt", "profiles.yml").write_text(content)
          print("profiles.yml written successfully")
          PYEOF

      - name: dbt debug (verify connection)
        run: dbt debug

      - name: dbt deps
        run: dbt deps

      - name: dbt compile (validate all models)
        run: dbt compile
