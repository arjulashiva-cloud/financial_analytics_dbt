name: dbt CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_DATABASE:  FINANCIAL_ANALYTICS
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-snowflake
        run: pip install "dbt-core==1.8.7" "dbt-snowflake==1.8.4"

      - name: Create profiles.yml
        run: |
          mkdir -p ~/.dbt
          echo "financial_analytics_dbt:"           > ~/.dbt/profiles.yml
          echo "  target: dev"                      >> ~/.dbt/profiles.yml
          echo "  outputs:"                         >> ~/.dbt/profiles.yml
          echo "    dev:"                           >> ~/.dbt/profiles.yml
          echo "      type: snowflake"              >> ~/.dbt/profiles.yml
          echo "      account: $SNOWFLAKE_ACCOUNT"  >> ~/.dbt/profiles.yml
          echo "      user: $SNOWFLAKE_USER"        >> ~/.dbt/profiles.yml
          echo "      password: $SNOWFLAKE_PASSWORD" >> ~/.dbt/profiles.yml
          echo "      database: FINANCIAL_ANALYTICS" >> ~/.dbt/profiles.yml
          echo "      warehouse: $SNOWFLAKE_WAREHOUSE" >> ~/.dbt/profiles.yml
          echo "      schema: STAGING"              >> ~/.dbt/profiles.yml
          echo "      role: $SNOWFLAKE_ROLE"        >> ~/.dbt/profiles.yml
          echo "      threads: 4"                   >> ~/.dbt/profiles.yml
          echo "profiles.yml created:"
          cat ~/.dbt/profiles.yml

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug

      - name: dbt compile
        run: dbt compile
