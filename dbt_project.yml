name: 'financial_analytics_dbt'
version: '1.0.0'
config-version: 2

profile: 'financial_analytics_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  financial_analytics_dbt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      finance:
        +materialized: table
        +schema: finance
      gtm:
        +materialized: table
        +schema: gtm
      governance:
        +materialized: table
        +schema: governance

vars:
  start_date: '2022-01-01'
